<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100 Ngày Sinh Tồn Trong Sương Mù</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a24;
      --panel-2: #1b2432;
      --border: #2a374c;
      --text: #e6edf7;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --ok: #22c55e;
      --bad: #ef4444;
      --rank-F: #cbd5e1;
      --rank-E: #a3e635;
      --rank-D: #22c55e;
      --rank-C: #38bdf8;
      --rank-B: #c084fc;
      --rank-A: #fb923c;
      --rank-S: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.45;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.83rem;
      transition: background 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
    }
    button:hover:not(:disabled) { background: #233044; border-color: #4b6388; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.42; cursor: not-allowed; }
    button.primary { background: #b45309; border-color: #d97706; color: #fff; }
    button.primary:hover:not(:disabled) { background: #c25e0c; }
    button.accent-btn { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
    button.accent-btn:hover:not(:disabled) { background: #2563eb; }
    button.danger-btn { background: #991b1b; border-color: #dc2626; color: #fff; }
    button.danger-btn:hover:not(:disabled) { background: #b91c1c; }
    button.success-btn { background: #15803d; border-color: #22c55e; color: #fff; }
    button.admin-btn { background: #6d28d9; border-color: #8b5cf6; color: #fff; }
    button.admin-btn:hover:not(:disabled) { background: #7c3aed; }
    input, select {
      background: #090d14;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 0.83rem;
    }
    .mat-ok { color: var(--ok); font-weight: 700; }
    .mat-bad { color: var(--bad); font-weight: 700; }
    .fullscreen-panel {
      position: fixed;
      inset: 0;
      z-index: 45;
      background: var(--bg);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .fullscreen-inner {
      width: 100%;
      max-width: 1220px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.72);
      margin-bottom: 24px;
    }
    .fullscreen-inner.admin-box { border-color: #a855f7; background: #181329; }
    #intro-overlay, #victory-overlay, #gameover-overlay, #craft-block-overlay, #levelup-overlay, #chest-reward-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 16, 0.94);
      z-index: 65;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }
    .intro-card, .fullscreen-modal {
      width: 100%;
      max-width: 780px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.65);
    }
    .victory-modal, .chest-modal { border-color: #d97706; }
    .levelup-modal { border-color: #38bdf8; }
    .gameover-modal { border-color: #ef4444; }
    .warn-modal { border-color: #f59e0b; }
    .intro-title { font-size: 1.3rem; color: #fbbf24; margin-bottom: 6px; }
    .intro-sub { color: var(--muted); font-size: 0.86rem; margin-bottom: 14px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .auth-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .auth-field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .auth-field input { width: 100%; }
    .auth-msg { font-size: 0.84rem; color: #fca5a5; min-height: 20px; margin-bottom: 10px; }
    .chest-loot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px; margin: 12px 0; }
    .chest-loot-btn {
      background: #0d131d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px;
      text-align: left;
      font-size: 0.84rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chest-loot-btn.active { border-color: #fbbf24; background: #222838; }
    .chest-item-detail {
      background: #0a0e16;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      padding: 11px;
      margin-bottom: 14px;
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .wheel-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 12px 0 18px; }
    .wheel-ring {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      border: 4px dashed #fbbf24;
      background: conic-gradient(from 0deg, #cbd5e1, #22c55e, #38bdf8, #c084fc, #fb923c, #f43f5e, #cbd5e1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wheel-core {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #0e1520;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: #fde68a;
      text-align: center;
      padding: 6px;
    }
    .spinning { animation: spinWheel 0.95s cubic-bezier(0.2, 0.85, 0.25, 1); }
    @keyframes spinWheel { from { transform: rotate(0deg); } to { transform: rotate(720deg); } }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 12px; margin-top: 10px; }
    .talent-card {
      min-height: 150px;
      border-radius: 10px;
      padding: 14px;
      background: #0d131e;
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .talent-card.face-down { align-items: center; justify-content: center; text-align: center; background: #111926; }
    .glow-F { border-color: var(--rank-F); }
    .glow-D { border-color: var(--rank-D); }
    .glow-C { border-color: var(--rank-C); }
    .glow-B { border-color: var(--rank-B); }
    .glow-A { border-color: var(--rank-A); }
    .glow-S { border-color: var(--rank-S); }
    .rank-F { color: var(--rank-F); font-weight: 700; }
    .rank-E { color: var(--rank-E); font-weight: 700; }
    .rank-D { color: var(--rank-D); font-weight: 700; }
    .rank-C { color: var(--rank-C); font-weight: 700; }
    .rank-B { color: var(--rank-B); font-weight: 700; }
    .rank-A { color: var(--rank-A); font-weight: 700; }
    .rank-S { color: var(--rank-S); font-weight: 700; }
    header.topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .stats-strip { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.8rem; }
    .pill { background: var(--panel-2); border: 1px solid var(--border); padding: 4px 9px; border-radius: 999px; }
    .pill-night { background: #2b111c; border-color: #ef4444; color: #fca5a5; font-weight: 700; }
    .pill-admin { background: #3b1c6e; border-color: #a78bfa; color: #f3e8ff; font-weight: 700; }
    .status-strip {
      background: #101a2d;
      border: 1px solid #2b4570;
      color: #dbeafe;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 10px 14px 0;
      font-size: 0.84rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }
    .status-strip.night-danger { background: #2e0d14; border-color: #dc2626; color: #fecaca; }
    .hp-low-alert {
      background: #3b0d11;
      border: 1px solid #ef4444;
      color: #fecaca;
      border-radius: 8px;
      padding: 8px 12px;
      margin: 8px 14px 0;
      font-size: 0.84rem;
      font-weight: 700;
    }
    .toggle-bar { display: flex; flex-wrap: wrap; gap: 6px; }
    .toggle-bar button.active-panel { border-color: #fbbf24; background: #252f42; color: #fde68a; }
    .home-hub { max-width: 1220px; margin: 16px auto 28px; padding: 0 14px; }
    .home-hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .home-quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .home-tile {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .home-tile:hover { border-color: #fbbf24; background: #192334; }
    .box-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #222e42;
    }
    .box-header h2 { font-size: 1.15rem; color: #fbbf24; margin: 0; }
    .item-thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #090d14;
      flex-shrink: 0;
    }
    .item-thumb-lg {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      border: 1.5px solid #38bdf8;
      background: #090d14;
      flex-shrink: 0;
    }
    .pet-thumb {
      width: 52px;
      height: 52px;
      border-radius: 9px;
      object-fit: cover;
      border: 1px solid #c084fc;
      background: #090d14;
      flex-shrink: 0;
    }
    .char-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .char-stat-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.86rem; }
    .talent-clickable { border-color: #d97706; cursor: pointer; background: #222634; }
    .talent-detail-box {
      background: #0d1320;
      border: 1px solid #d97706;
      border-radius: 8px;
      padding: 11px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      color: #fde68a;
    }
    .camp-actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: #0d131d;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 8px; margin-top: 8px; }
    .map-node { background: #0d1420; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: left; font-size: 0.82rem; }
    .map-node.selected { border-color: #38bdf8; background: #15253c; }
    .map-node.marked { border-color: #f59e0b; }
    .prep-section {
      background: #0d131d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      font-size: 0.82rem;
